<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Transcription Demo</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .status {
            display: inline-block;
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: #ddd;
            color: #555;
            margin-bottom: 24px;
        }

        .status.live {
            background: #d1fae5;
            color: #065f46;
        }

        /* Metrics row */
        .metrics {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric {
            flex: 1;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .metric-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 600;
            color: #111;
        }

        .metric-unit {
            font-size: 0.75rem;
            color: #888;
            margin-left: 2px;
        }

        /* Live partial */
        .section-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .partial-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 16px;
            min-height: 52px;
            font-size: 1rem;
            color: #999;
            font-style: italic;
            margin-bottom: 20px;
        }

        .queue-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 16px;
            min-height: 80px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        .queue-empty {
            color: #aaa;
            font-style: italic;
        }

        .letter-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.3s ease;
        }

        .letter-item.first {
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%);
            box-shadow: 0 4px 12px rgba(241, 39, 17, 0.3);
            animation: pulse 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* History */
        #history {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 0;
            max-height: 320px;
            overflow-y: auto;
        }

        .empty {
            padding: 20px 16px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }

        .entry {
            display: flex;
            gap: 14px;
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
            animation: fadeIn 0.2s ease;
        }

        .entry:last-child {
            border-bottom: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .entry-time {
            color: #aaa;
            white-space: nowrap;
            padding-top: 1px;
        }

        .entry-text {
            color: #222;
        }

        /* Control button */
        .control-btn {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #059669;
        }

        .control-btn.stop {
            background: #ef4444;
        }

        .control-btn.stop:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <h1>Live Transcription</h1>
    <div class="status" id="status">Connecting…</div>

    <!-- Metrics -->
    <div class="metrics">
        <div class="metric">
            <div class="metric-label">RAM Usage</div>
            <div><span class="metric-value" id="ram-val">–</span><span class="metric-unit">MB</span></div>
        </div>
        <div class="metric">
            <div class="metric-label">Avg Result Latency</div>
            <div><span class="metric-value" id="lat-avg-r">–</span><span class="metric-unit">ms</span></div>
        </div>
        <div class="metric">
            <div class="metric-label">Max Result Latency</div>
            <div><span class="metric-value" id="lat-max-r">–</span><span class="metric-unit">ms</span></div>
        </div>
        <div class="metric">
            <div class="metric-label">Avg Partial Latency</div>
            <div><span class="metric-value" id="lat-avg-p">–</span><span class="metric-unit">ms</span></div>
        </div>
    </div>

    <!-- Partial -->
    <div class="section-label">Currently hearing</div>
    <div class="partial-box" id="partial">…</div>

    <!-- Queue -->
    <div class="section-label">📋 Letter Queue</div>
    <div class="queue-box" id="queue-display">
        <span class="queue-empty">Queue is empty...</span>
    </div>

    <!-- Letter being sent to hardware -->
    <div class="section-label">Sending to hardware</div>
    <div class="partial-box" id="letter"
        style="font-style: normal; color: #10b981; font-weight: 600; font-size: 1.5rem; text-align: center;">–</div>

    <!-- History -->
    <div class="section-label">Transcription history</div>
    <div id="history">
        <div class="empty" id="empty-msg">No results yet.</div>
    </div>

    <!-- Control button -->
    <button id="control-btn" class="control-btn">Start Recognition</button>

    <script>
        const statusEl = document.getElementById('status');
        const partialEl = document.getElementById('partial');
        const letterEl = document.getElementById('letter');
        const queueDisplay = document.getElementById('queue-display');
        const historyEl = document.getElementById('history');
        const controlBtn = document.getElementById('control-btn');
        let isRecognizing = false;

        function setStatus(live) {
            statusEl.textContent = live ? '● Live' : 'Disconnected';
            statusEl.className = 'status' + (live ? ' live' : '');
        }

        function updateButtonState(isListening) {
            isRecognizing = isListening;
            controlBtn.textContent = isListening ? 'Stop Recognition' : 'Start Recognition';
            controlBtn.className = 'control-btn' + (isListening ? ' stop' : '');
        }

        function updateQueueDisplay(queue) {
            if (queue.length === 0) {
                queueDisplay.innerHTML = '<span class="queue-empty">Queue is empty...</span>';
            } else {
                queueDisplay.innerHTML = '';
                queue.forEach((letter, index) => {
                    const letterBox = document.createElement('div');
                    letterBox.className = 'letter-item' + (index === 0 ? ' first' : '');
                    letterBox.textContent = letter;
                    queueDisplay.appendChild(letterBox);
                });
            }
        }

        function addEntry(text, ts) {
            document.getElementById('empty-msg')?.remove();
            const div = document.createElement('div');
            div.className = 'entry';
            div.innerHTML = `<span class="entry-time">${ts}</span><span class="entry-text">${text}</span>`;
            historyEl.appendChild(div);
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // Query initial status on page load
        fetch('/status')
            .then(r => r.json())
            .then(d => updateButtonState(d.is_running))
            .catch(err => console.error('Failed to get initial status:', err));

        controlBtn.addEventListener('click', async () => {
            const endpoint = isRecognizing ? '/stop' : '/start';
            try {
                await fetch(endpoint, { method: 'POST' });
                // Query status after request to sync UI
                const statusResp = await fetch('/status');
                const statusData = await statusResp.json();
                updateButtonState(statusData.is_running);
            } catch (err) {
                console.error('Control request failed:', err);
            }
        });

        const es = new EventSource('/stream');
        es.onopen = () => setStatus(true);
        es.onerror = () => setStatus(false);
        es.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if (d.type === 'heartbeat') return;
            if (d.type === 'status') {
                updateButtonState(d.text === 'Listening');
                setStatus(d.text === 'Listening');
                return;
            }
            if (d.type === 'ram') { document.getElementById('ram-val').textContent = d.mb.toFixed(1); return; }
            if (d.type === 'partial') { partialEl.textContent = d.text || '…'; setStatus(true); return; }
            if (d.type === 'queue_update') { updateQueueDisplay(d.queue); return; }
            if (d.type === 'letter') { letterEl.textContent = d.text || '–'; return; }
            if (d.type === 'result') {
                partialEl.textContent = '…';
                addEntry(d.text, d.ts);
                if (d.avg_result_ms != null) document.getElementById('lat-avg-r').textContent = d.avg_result_ms.toFixed(1);
                if (d.max_result_ms != null) document.getElementById('lat-max-r').textContent = d.max_result_ms.toFixed(1);
                if (d.avg_partial_ms != null) document.getElementById('lat-avg-p').textContent = d.avg_partial_ms.toFixed(1);
            }
        };
    </script>
</body>

</html>
