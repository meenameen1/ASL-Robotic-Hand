<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STT Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }

    .status {
      display: inline-block;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: #fee2e2;
      color: #b91c1c;
      margin-bottom: 24px;
    }

    .status.live {
      background: #d1fae5;
      color: #065f46;
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Queue */
    .queue-area {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 48px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .queue-empty {
      color: #ccc;
      font-size: 0.85rem;
    }

    .letter {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .letter.next {
      background: #fde68a;
      color: #92400e;
    }

    /* ASL sign box */
    .asl-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .asl-img-wrap {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      background: #f3f4f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .asl-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .asl-img-wrap .asl-placeholder {
      font-size: 0.75rem;
      color: #ccc;
      text-align: center;
      padding: 8px;
    }

    .asl-info {
      flex: 1;
    }

    .asl-letter {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
      line-height: 1;
      margin-bottom: 6px;
    }

    .asl-sublabel {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    /* RAM box */
    .ram-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ram-label {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .ram-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111;
    }

    /* Latency box */
    .latency-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .latency-item {
      display: flex;
      flex-direction: column;
    }

    .latency-label {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .latency-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
    }

    /* Control buttons */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.start {
      background: #10b981;
      color: white;
    }

    button.start:hover:not(:disabled) {
      background: #059669;
    }

    button.start:disabled {
      background: #d1d5db;
      color: #9ca3af;
      cursor: not-allowed;
    }

    button.stop {
      background: #ef4444;
      color: white;
    }

    button.stop:hover:not(:disabled) {
      background: #dc2626;
    }

    button.stop:disabled {
      background: #d1d5db;
      color: #9ca3af;
      cursor: not-allowed;
    }

    /* Terminal log */
    #log {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 14px;
      height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-line {
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line.said {
      color: #86efac;
    }

    .log-line.latency {
      color: #fde68a;
    }

    .log-line.info {
      color: #d4d4d4;
    }
  </style>
</head>

<body>

  <h1>STT Demo</h1>
  <div class="status" id="status">● Disconnected</div>

  <div class="label">Controls</div>
  <div class="controls">
    <button class="start" id="startBtn">Start Recognizing</button>
    <button class="stop" id="stopBtn" disabled>Stop Recognizing</button>
  </div>

  <div class="label">Now Sending</div>
  <div class="asl-box">
    <div class="asl-img-wrap" id="asl-img-wrap">
      <div class="asl-placeholder">Waiting for<br />letter…</div>
    </div>
    <div class="asl-info">
      <div class="asl-letter" id="asl-letter">–</div>
      <div class="asl-sublabel">ASL Fingerspelling</div>
    </div>
  </div>

  <div class="label">Letter Queue</div>
  <div class="queue-area" id="queue">
    <span class="queue-empty">Queue is empty</span>
  </div>

  <div class="label">Memory Usage</div>
  <div class="ram-box">
    <span class="ram-label">RAM</span>
    <span class="ram-value" id="ram-value">– MB</span>
  </div>

  <div class="label">Latency Metrics</div>
  <div class="latency-box">
    <div class="latency-item">
      <span class="latency-label">Avg Result</span>
      <span class="latency-value" id="avg-result-latency">– ms</span>
    </div>
    <div class="latency-item">
      <span class="latency-label">Max Result</span>
      <span class="latency-value" id="max-result-latency">– ms</span>
    </div>
    <div class="latency-item">
      <span class="latency-label">Avg Partial</span>
      <span class="latency-value" id="avg-partial-latency">– ms</span>
    </div>
  </div>

  <div class="label">Terminal Output</div>
  <div id="log"></div>

  <script>
    const socket = io();
    const logEl = document.getElementById("log");
    const queueEl = document.getElementById("queue");
    const statusEl = document.getElementById("status");

    socket.on("connect", () => { statusEl.textContent = "● Live"; statusEl.className = "status live"; });
    socket.on("disconnect", () => { statusEl.textContent = "● Disconnected"; statusEl.className = "status"; });

    socket.on("log", ({ line }) => {
      const div = document.createElement("div");
      div.className = "log-line " + classify(line);
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    });

    socket.on("queue_update", (letters) => {
      if (!letters.length) {
        queueEl.innerHTML = '<span class="queue-empty">Queue is empty</span>';
        return;
      }
      queueEl.innerHTML = letters.map((l, i) =>
        `<div class="letter${i === 0 ? " next" : ""}">${l}</div>`
      ).join("");
    });

    socket.on("ram_update", ({ ram_mb }) => {
      document.getElementById("ram-value").textContent = `${ram_mb.toFixed(2)} MB`;
    });

    socket.on("latency_update", (data) => {
      if (data.avg_result !== undefined) {
        document.getElementById("avg-result-latency").textContent = `${data.avg_result.toFixed(2)} ms`;
      }
      if (data.max_result !== undefined) {
        document.getElementById("max-result-latency").textContent = `${data.max_result.toFixed(2)} ms`;
      }
      if (data.avg_partial !== undefined) {
        document.getElementById("avg-partial-latency").textContent = `${data.avg_partial.toFixed(2)} ms`;
      }
    });

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    startBtn.addEventListener("click", () => {
      socket.emit("start_recognizing");
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener("click", () => {
      socket.emit("stop_recognizing");
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    socket.on("recognizing_status", ({ status }) => {
      if (status === "listening") {
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } else if (status === "paused") {
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    });

    function classify(line) {
      if (line.startsWith("You said")) return "said";
      if (line.includes("Latency")) return "latency";
      return "info";
    }

    // ASL image source — lifeprint.com fingerspelling (public educational resource)
    // Falls back to handspeak.com if image fails to load
    socket.on("sending_letter", ({ letter }) => {
      const l = letter.toUpperCase();
      document.getElementById("asl-letter").textContent = l;

      const wrap = document.getElementById("asl-img-wrap");
      const src = `https://www.lifeprint.com/asl101/fingerspelling/images/${l.toLowerCase()}.gif`;

      const img = document.createElement("img");
      img.alt = `ASL letter ${l}`;
      img.src = src;
      img.onerror = () => {
        // fallback: show styled letter if image can't load
        wrap.innerHTML = `<div style="font-size:3.5rem;font-weight:900;color:#6b7280;">${l}</div>`;
      };
      wrap.innerHTML = "";
      wrap.appendChild(img);
    });
  </script>
</body>

</html>
